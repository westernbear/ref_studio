[project]
name = "rvs-compiler"
version = "0.0.0"
description = "Reference Video Studio deterministic CPU compiler"
requires-python = "==3.12.*"
dependencies = [
    "easyocr==1.7.2",
    "librosa==0.11.0",
    "numpy==2.2.6",
    "opencv-python-headless==4.11.0.86",
    "scipy==1.15.3",
    "soundfile==0.13.1",
    "torch==2.9.1+cpu",
    "torchvision==0.24.1+cpu",
]

[dependency-groups]
dev = ["basedpyright", "pytest", "ruff"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
include = ["src", "tests"]
venvPath = "/home/singlerr/ref_studio/compiler"
venv = ".venv"
extraPaths = [".venv/lib/python3.12/site-packages"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001"]
