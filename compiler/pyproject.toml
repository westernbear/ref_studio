[project]
name = "rvs-compiler"
version = "0.0.0"
description = "Reference Video Studio deterministic CPU compiler"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = ["basedpyright", "pytest", "ruff"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
include = [".", "tests"]
venvPath = "/home/singlerr/ref_studio/compiler"
venv = ".venv"
extraPaths = [".venv/lib/python3.12/site-packages"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001"]
