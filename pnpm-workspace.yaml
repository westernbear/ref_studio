packages:
  - apps/*
  - packages/*

allowBuilds:
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  sharp: true

overrides:
  sharp: 0.35.2
  postcss: 8.5.18

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - better-sqlite3
  - esbuild
  - sharp

minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.42'
  - '@ai-sdk/gateway@4.0.64'
  - '@ai-sdk/google@4.0.51'
  - '@ai-sdk/openai@4.0.47'
  - '@ai-sdk/provider-utils@5.0.30'
  - '@ai-sdk/provider@4.0.8'
  - '@ai-sdk/xai@4.0.44'
  - ai@7.0.79
