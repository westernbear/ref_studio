services:
  runtime:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      provenance: false
    image: reference-video-studio-runtime:todo1
    network_mode: none
  runtime-preflight:
    profiles: ["verify"]
    image: reference-video-studio-runtime:todo1
    network_mode: none
    command: ["node", "/opt/rvs/preflight.mjs"]
  compiler:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: Dockerfile
      target: compiler
      provenance: false
    image: reference-video-studio-compiler:task17
    network_mode: none
    command: ["python3.12", "-m", "compiler.preflight"]
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      provenance: false
    image: reference-video-studio-runtime:todo1
    networks: [appnet, default]
    environment:
      CI: "true"
      PNPM_CONFIG_CONFIRM_MODULES_PURGE: "false"
    working_dir: /workspace/apps/web
    volumes:
      - .:/workspace
      - web_pnpm_store:/workspace/.pnpm-store
      - web_root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
    ports:
      - "127.0.0.1:3100:3100"
    command:
      [
        "sh",
        "-lc",
        "pnpm --filter @rvs/web install --frozen-lockfile && pnpm --filter @rvs/web build && pnpm --filter @rvs/web exec next start --hostname 0.0.0.0 --port 3100",
      ]
  api:
    profiles: ["verify"]
    image: reference-video-studio-runtime:todo1
    networks: [appnet]
    command: ["node", "--version"]
  qa:
    profiles: ["qa"]
    image: reference-video-studio-runtime:todo1
    network_mode: none
    environment:
      CI: "true"
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      PNPM_MANAGE_PACKAGE_MANAGER_VERSIONS: "false"
      PNPM_CONFIG_OFFLINE: "true"
      PNPM_CONFIG_FROZEN_LOCKFILE: "true"
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["pnpm", "test:security"]

  qa-audit-egress:
    profiles: ["verify"]
    image: reference-video-studio-runtime:todo1
    working_dir: /workspace
    volumes:
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
    command: ["node", "--version"]

networks:
  appnet:
    internal: true

volumes:
  web_node_modules:
  web_pnpm_store:
  web_root_node_modules:
