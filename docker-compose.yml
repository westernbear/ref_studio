services:
  runtime:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      provenance: false
    image: reference-video-studio-runtime:1.0.0
    network_mode: none
  runtime-preflight:
    profiles: ["verify"]
    image: reference-video-studio-runtime:1.0.0
    network_mode: none
    command: ["node", "/opt/rvs/preflight.mjs"]
  compiler:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: Dockerfile
      target: compiler
      provenance: false
    image: reference-video-studio-compiler:1.0.0
    network_mode: none
    command: ["python3.12", "-m", "compiler.preflight"]
  web:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      provenance: false
    image: reference-video-studio-runtime:1.0.0
    networks: [appnet, default]
    environment:
      CI: "true"
      PNPM_CONFIG_CONFIRM_MODULES_PURGE: "false"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      RVS_INTERNAL_API_URL: ${RVS_INTERNAL_API_URL:-http://api:3200}
      RVS_INSECURE_COOKIES: ${RVS_INSECURE_COOKIES:-true}
      RVS_EXPECTED_ORIGIN: ${RVS_EXPECTED_ORIGIN:-http://localhost:3100}
    working_dir: /workspace/apps/web
    volumes:
      - .:/workspace
      - web_pnpm_store:/workspace/.pnpm-store
      - web_root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
    ports:
      - "0.0.0.0:3100:3100"
    command:
      [
        "sh",
        "-c",
        "pnpm --filter @rvs/web install --frozen-lockfile && pnpm --filter @rvs/web build && pnpm --filter @rvs/web exec next start --hostname 0.0.0.0 --port 3100",
      ]
  api:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      provenance: false
    image: reference-video-studio-runtime:1.0.0
    networks: [appnet, default]
    env_file:
      - path: .env
        required: false
    environment:
      CI: "true"
      PNPM_CONFIG_CONFIRM_MODULES_PURGE: "false"
      DATABASE_PATH: ${DATABASE_PATH:-/workspace/apps/api/data/app.sqlite}
      HOST: "0.0.0.0"
      PORT: "3200"
      RVS_EXPECTED_ORIGIN: ${RVS_EXPECTED_ORIGIN:-http://localhost:3100}
      RVS_SESSION_INTROSPECT_SECRET: ${RVS_SESSION_INTROSPECT_SECRET:?RVS_SESSION_INTROSPECT_SECRET must be set}
      RVS_WORKER_TOKEN: ${RVS_WORKER_TOKEN:?RVS_WORKER_TOKEN must be set}
    working_dir: /workspace/apps/api
    volumes:
      - .:/workspace
      - api_pnpm_store:/workspace/.pnpm-store
      - api_root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
      - api_contracts_node_modules:/workspace/packages/contracts/node_modules
    ports:
      - "0.0.0.0:3200:3200"
    command:
      [
        "sh",
        "-c",
        "pnpm install --frozen-lockfile && pnpm --filter @rvs/api db:verify && pnpm --filter @rvs/api build && pnpm --filter @rvs/api start",
      ]
  api-relay:
    image: reference-video-studio-worker:1.0.0
    restart: always
    init: true
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      RVS_API_BASE_URL: http://api:3200
      RVS_RELAY_REQUEST_TIMEOUT_MS: ${RVS_RELAY_REQUEST_TIMEOUT_MS:-1800000}
    command: ["node", "dist/api-relay.js"]
    networks:
      - appnet
      - worker-internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require("node:http").get("http://127.0.0.1:8787/_relay/healthz",response=>process.exit(response.statusCode===204?0:1)).on("error",()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
  worker:
    image: reference-video-studio-worker:1.0.0
    restart: always
    init: true
    stop_grace_period: 30s
    cpus: 4.0
    mem_limit: 12g
    pids_limit: 512
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    depends_on:
      api-relay:
        condition: service_healthy
    environment:
      RVS_API_BASE_URL: http://api-relay:8787
      RVS_WORKER_TOKEN: ${RVS_WORKER_TOKEN:?RVS_WORKER_TOKEN must be set}
      RVS_WORKER_CAPABILITIES: ${RVS_WORKER_CAPABILITIES:-compiler,renderer}
      RVS_API_REQUEST_TIMEOUT_MS: ${RVS_API_REQUEST_TIMEOUT_MS:-30000}
      RVS_MEDIA_REQUEST_TIMEOUT_MS: ${RVS_MEDIA_REQUEST_TIMEOUT_MS:-1800000}
      RVS_HEARTBEAT_INTERVAL_MS: ${RVS_HEARTBEAT_INTERVAL_MS:-30000}
      RVS_POLL_INTERVAL_MS: ${RVS_POLL_INTERVAL_MS:-5000}
    networks:
      - worker-internal
  qa:
    profiles: ["qa"]
    image: reference-video-studio-runtime:1.0.0
    network_mode: none
    environment:
      CI: "true"
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      PNPM_MANAGE_PACKAGE_MANAGER_VERSIONS: "false"
      PNPM_CONFIG_OFFLINE: "true"
      PNPM_CONFIG_FROZEN_LOCKFILE: "true"
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["pnpm", "test:security"]

  qa-audit-egress:
    profiles: ["verify"]
    image: reference-video-studio-runtime:1.0.0
    working_dir: /workspace
    volumes:
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
    command: ["node", "--version"]

networks:
  appnet:
    internal: true
  worker-internal:
    internal: true

volumes:
  api_contracts_node_modules:
  api_node_modules:
  api_pnpm_store:
  api_root_node_modules:
  web_node_modules:
  web_pnpm_store:
  web_root_node_modules:
